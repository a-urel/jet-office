name: jet_office
description: >-
  Pure-Dart library that generates, reads and modifies XLSX and DOCX files.
  Bytes in, bytes out: no Flutter and no dart:io, so it runs on the web,
  desktop, mobile and server alike.
version: 0.1.0-dev.1
repository: https://github.com/a-urel/jet-office
issue_tracker: https://github.com/a-urel/jet-office/issues
# Not published until phase 1 ships (docs/decisions/0001).
publish_to: none

workspace:
  - packages/jet_core
  - packages/jet_charts_core

environment:
  # Matches Monépro's floor, the first consumer.
  sdk: ^3.9.0

# archive, jet_core and jet_charts_core are the only runtime dependencies
# (decisions 0001, 0012 and 0014). archive's lower bound is the version Monépro
# and jet_print already lock, so neither gets a forced bump. Only
# lib/src/zip/archive_adapter.dart may import archive. jet_core, the number
# format engine, is a package of this repository's workspace (decision 0013),
# and so is jet_charts_core, the chart model, which the DrawingML layer uses
# from C1 (decision 0014).
dependencies:
  archive: ^4.0.9
  jet_core:
    path: packages/jet_core
  jet_charts_core:
    path: packages/jet_charts_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
  # Tests only: checks that every generated part is well-formed XML.
  xml: '>=6.5.0 <8.0.0'
