name: jet_core
description: >-
  Pure-Dart building blocks shared by the jet_ packages: the number format
  engine today. It knows no file format, has no dependencies and runs on the
  web, desktop, mobile and server alike.
version: 0.1.0-dev.1
repository: https://github.com/a-urel/jet-core
issue_tracker: https://github.com/a-urel/jet-core/issues
# Not published until the extraction ships.
publish_to: none

environment:
  sdk: ^3.9.0

# Empty on purpose: jet_core has no runtime dependency (AGENTS.md, "Hard
# rules"). test/architecture/dependencies_test.dart enforces it.
dependencies:

dev_dependencies:
  # Tests only: the oracle workbooks are written as XLSX (a later task).
  archive: ^4.0.9
  lints: ^6.0.0
  test: ^1.26.0
  # Tests only: checks that generated parts are well-formed XML.
  xml: '>=6.5.0 <8.0.0'
