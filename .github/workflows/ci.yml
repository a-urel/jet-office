name: CI

# The `quality-gate` job runs the quality gate from AGENTS.md. The `validate`
# job then checks the XLSX and DOCX fixtures with the Open XML SDK and
# LibreOffice (decision 0003), compares LibreOffice's re-save with the reader
# and the models, and proves that each check rejects a corrupt file (the model
# round trips excepted: the validator rejects the models' output of it). A
# clean checkout must pass both jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub's default shell, `bash -e {0}`, has no pipefail, so `cmd | tee log`
# reports tee's status. An explicit shell makes GitHub run
# `bash --noprofile --norc -eo pipefail {0}` for every step.
defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero infos)
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Run tests on Chrome
        run: dart test -p chrome

  validate:
    name: validate fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality-gate
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Resolve dependencies
        run: dart pub get

      - name: Write the fixtures
        run: dart run tool/write_fixtures.dart build/fixtures

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate with the Open XML SDK
        run: dotnet run --project tool/ooxml_validate -- build/fixtures

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc libreoffice-writer

      # Filter options: tool/compare_csv.dart explains each token.
      - name: Export every sheet to CSV with LibreOffice
        env:
          LC_ALL: C.UTF-8
        run: |
          soffice --headless \
            --convert-to 'csv:Text - txt - csv (StarCalc):44,34,UTF8,1,,0,false,true,false,false,false,-1' \
            --outdir build/fixtures build/fixtures/*.xlsx
          ls -1 build/fixtures

      - name: Compare the CSV files with the expected values
        run: dart run tool/compare_csv.dart build/fixtures

      # LibreOffice recalculates on load and saves what it computed; the
      # reader must find the expected values in that file.
      - name: Re-save every fixture with LibreOffice
        env:
          LC_ALL: C.UTF-8
        run: |
          mkdir -p build/resaved
          soffice --headless --convert-to 'xlsx:Calc MS Excel 2007 XML' \
            --outdir build/resaved build/fixtures/*.xlsx
          ls -1 build/resaved

      - name: Read the re-saved fixtures and compare
        run: dart run tool/compare_resaved.dart build/fixtures build/resaved

      # The model must reproduce a workbook it changes nothing in, and
      # what it saves must be valid: on the writer fixtures and on
      # LibreOffice's re-save of them.
      - name: Round-trip the fixtures through the model
        run: dart run tool/round_trip_model.dart build/fixtures build/model

      - name: Round-trip the re-saved fixtures through the model
        run: dart run tool/round_trip_model.dart build/resaved build/model-resaved

      - name: Validate the model's output with the Open XML SDK
        run: dotnet run --project tool/ooxml_validate -- build/model

      - name: Validate the model's output for the re-saved fixtures
        run: dotnet run --project tool/ooxml_validate -- build/model-resaved

      # What the model saves after a change must be valid too: every
      # fixture with a date, a date-time, a formula and a string set and a
      # sheet added, plus a workbook generated from nothing.
      - name: Edit the fixtures through the model
        run: dart run tool/edit_model.dart build/fixtures build/model-edited

      - name: Validate the model's edited and generated output
        run: dotnet run --project tool/ooxml_validate -- build/model-edited

      # DOCX (phase 4). tool/write_fixtures.dart wrote the D1 documents
      # beside the workbooks, and the Open XML SDK step above validated them.
      # LibreOffice's text export must hold each document's expected text.
      - name: Export every document to text with LibreOffice
        env:
          LC_ALL: C.UTF-8
        run: |
          soffice --headless --convert-to 'txt:Text (encoded):UTF8' \
            --outdir build/fixtures build/fixtures/*.docx
          ls -1 build/fixtures/*.txt

      - name: Compare the text exports with the expected texts
        run: dart run tool/compare_text.dart build/fixtures

      # LibreOffice's re-save is another producer's file: the model must
      # read the expected text from it, with no warning, and reproduce it.
      - name: Re-save every document with LibreOffice
        env:
          LC_ALL: C.UTF-8
        run: |
          mkdir -p build/resaved-docx
          soffice --headless --convert-to 'docx:MS Word 2007 XML' \
            --outdir build/resaved-docx build/fixtures/*.docx
          ls -1 build/resaved-docx

      - name: Read the re-saved documents and compare
        run: dart run tool/compare_resaved_docx.dart build/fixtures build/resaved-docx

      - name: Round-trip the documents through the model
        run: dart run tool/round_trip_docx.dart build/fixtures build/model-docx-fixtures

      - name: Round-trip the re-saved documents through the model
        run: dart run tool/round_trip_docx.dart build/resaved-docx build/model-docx

      - name: Round-trip the owner's Word files through the model
        run: dart run tool/round_trip_docx.dart test/fixtures/owner/docx build/model-docx-owner

      - name: Validate the model's output for the documents
        run: |
          dotnet run --project tool/ooxml_validate -- build/model-docx-fixtures
          dotnet run --project tool/ooxml_validate -- build/model-docx
          dotnet run --project tool/ooxml_validate -- build/model-docx-owner

      # Negative control: every check must reject m1_corrupt.xlsx (see
      # tool/write_fixtures.dart), except the model round trip, which passes
      # on it: the model keeps the corrupt file's stray content faithfully, so
      # the Open XML SDK must reject the model's output instead (and the
      # round trip must reject a truncated copy). Each tool exits with 1 when
      # it finds a problem and with 2 or 64 for a usage error, so the step
      # requires exit code 1 and the expected message, not merely a failure.
      - name: Prove the checks reject a corrupt file
        env:
          LC_ALL: C.UTF-8
        run: |
          dart run tool/write_fixtures.dart build/corrupt --corrupt
          # Keep only the corrupt workbook, so nothing else can fail.
          find build/corrupt -type f ! -name 'm1_corrupt.*' -delete
          ls -1 build/corrupt

          status=0
          dotnet run --project tool/ooxml_validate -- build/corrupt \
            | tee build/corrupt-validate.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The Open XML SDK validator exited with $status on a corrupt file; expected 1."
            exit 1
          fi
          if ! grep -q 'FAIL  m1_corrupt.xlsx' build/corrupt-validate.log; then
            echo "::error::The Open XML SDK validator did not report m1_corrupt.xlsx."
            exit 1
          fi

          soffice --headless \
            --convert-to 'csv:Text - txt - csv (StarCalc):44,34,UTF8,1,,0,false,true,false,false,false,-1' \
            --outdir build/corrupt build/corrupt/m1_corrupt.xlsx
          ls -1 build/corrupt

          status=0
          dart run tool/compare_csv.dart build/corrupt \
            | tee build/corrupt-compare.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The CSV comparison exited with $status on a corrupt file; expected 1."
            exit 1
          fi
          if ! grep -q 'A2: expected 42, got "41"' build/corrupt-compare.log; then
            echo "::error::The CSV comparison did not report the corrupt value in A2."
            exit 1
          fi

          mkdir -p build/corrupt-resaved
          soffice --headless --convert-to 'xlsx:Calc MS Excel 2007 XML' \
            --outdir build/corrupt-resaved build/corrupt/m1_corrupt.xlsx
          ls -1 build/corrupt-resaved

          status=0
          dart run tool/compare_resaved.dart build/corrupt build/corrupt-resaved \
            | tee build/corrupt-resaved.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The re-save comparison exited with $status on a corrupt file; expected 1."
            exit 1
          fi
          if ! grep -q 'A2: expected 42' build/corrupt-resaved.log; then
            echo "::error::The re-save comparison did not report the corrupt value in A2."
            exit 1
          fi

          # The model keeps what it does not understand, so the corrupt
          # workbook round-trips unchanged (exit 0) and the Open XML SDK
          # must reject the model's output; a truncated copy is refused
          # by the model itself (exit 1).
          status=0
          dart run tool/round_trip_model.dart build/corrupt build/corrupt-model \
            || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The model round trip exited with $status on the corrupt file; expected 0."
            exit 1
          fi
          status=0
          dotnet run --project tool/ooxml_validate -- build/corrupt-model \
            | tee build/corrupt-model-validate.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The Open XML SDK validator exited with $status on the model's output for a corrupt file; expected 1."
            exit 1
          fi
          if ! grep -q 'FAIL  m1_corrupt.xlsx' build/corrupt-model-validate.log; then
            echo "::error::The Open XML SDK validator did not report the model's output for m1_corrupt.xlsx."
            exit 1
          fi

          mkdir -p build/truncated
          size=$(wc -c < build/corrupt/m1_corrupt.xlsx)
          head -c $((size / 2)) build/corrupt/m1_corrupt.xlsx > build/truncated/m1_truncated.xlsx
          status=0
          dart run tool/round_trip_model.dart build/truncated build/truncated-model \
            | tee build/truncated-model.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The model round trip exited with $status on a truncated file; expected 1."
            exit 1
          fi
          if ! grep -q 'm1_truncated.xlsx: ' build/truncated-model.log; then
            echo "::error::The model round trip did not report m1_truncated.xlsx."
            exit 1
          fi
          echo "All checks rejected the corrupt file."

      # Negative control for DOCX: d1_corrupt.docx (see
      # tool/write_fixtures.dart) has a w:r directly under w:body, which the
      # Open XML SDK must reject, and "first" spelled "firzt", which the
      # text export and the re-save comparison must reject. The model keeps
      # the stray run as written, so its round trip passes (exit 0) and the
      # Open XML SDK must reject its output; a truncated copy is refused by
      # the model itself (exit 1). As above, each check must exit with 1 and
      # name the file or the line, not merely fail.
      - name: Prove the DOCX checks reject a corrupt document
        env:
          LC_ALL: C.UTF-8
        run: |
          dart run tool/write_fixtures.dart build/corrupt-docx --corrupt
          # Keep only the corrupt document, so nothing else can fail.
          find build/corrupt-docx -type f ! -name 'd1_corrupt.*' -delete
          ls -1 build/corrupt-docx

          status=0
          dotnet run --project tool/ooxml_validate -- build/corrupt-docx \
            | tee build/corrupt-docx-validate.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The Open XML SDK validator exited with $status on a corrupt document; expected 1."
            exit 1
          fi
          if ! grep -q 'FAIL  d1_corrupt.docx' build/corrupt-docx-validate.log; then
            echo "::error::The Open XML SDK validator did not report d1_corrupt.docx."
            exit 1
          fi

          soffice --headless --convert-to 'txt:Text (encoded):UTF8' \
            --outdir build/corrupt-docx build/corrupt-docx/d1_corrupt.docx
          ls -1 build/corrupt-docx

          status=0
          dart run tool/compare_text.dart build/corrupt-docx \
            | tee build/corrupt-docx-text.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The text comparison exited with $status on a corrupt document; expected 1."
            exit 1
          fi
          if ! grep -q 'd1_corrupt: line 1: expected "The first paragraph.", got "The firzt paragraph."' build/corrupt-docx-text.log; then
            echo "::error::The text comparison did not report the changed letter."
            exit 1
          fi

          mkdir -p build/corrupt-docx-resaved
          soffice --headless --convert-to 'docx:MS Word 2007 XML' \
            --outdir build/corrupt-docx-resaved build/corrupt-docx/d1_corrupt.docx
          ls -1 build/corrupt-docx-resaved

          status=0
          dart run tool/compare_resaved_docx.dart build/corrupt-docx build/corrupt-docx-resaved \
            | tee build/corrupt-docx-resaved.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The re-save comparison exited with $status on a corrupt document; expected 1."
            exit 1
          fi
          if ! grep -q 'd1_corrupt: line 1: expected "The first paragraph."' build/corrupt-docx-resaved.log; then
            echo "::error::The re-save comparison did not report the changed letter."
            exit 1
          fi

          status=0
          dart run tool/round_trip_docx.dart build/corrupt-docx build/corrupt-docx-model \
            || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The model round trip exited with $status on the corrupt document; expected 0."
            exit 1
          fi
          status=0
          dotnet run --project tool/ooxml_validate -- build/corrupt-docx-model \
            | tee build/corrupt-docx-model-validate.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The Open XML SDK validator exited with $status on the model's output for a corrupt document; expected 1."
            exit 1
          fi
          if ! grep -q 'FAIL  d1_corrupt.docx' build/corrupt-docx-model-validate.log; then
            echo "::error::The Open XML SDK validator did not report the model's output for d1_corrupt.docx."
            exit 1
          fi

          mkdir -p build/truncated-docx
          size=$(wc -c < build/corrupt-docx/d1_corrupt.docx)
          head -c $((size / 2)) build/corrupt-docx/d1_corrupt.docx > build/truncated-docx/d1_truncated.docx
          status=0
          dart run tool/round_trip_docx.dart build/truncated-docx build/truncated-docx-model \
            | tee build/truncated-docx-model.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The model round trip exited with $status on a truncated document; expected 1."
            exit 1
          fi
          if ! grep -q 'd1_truncated.docx: ' build/truncated-docx-model.log; then
            echo "::error::The model round trip did not report d1_truncated.docx."
            exit 1
          fi
          echo "All checks rejected the corrupt document."

      # A second opinion on the number formatter, not Excel: LibreOffice's
      # text "as shown" for each oracle case. The tool lists differences
      # and exits 0 with any; these steps never fail the job.
      - name: Export the number format oracle as shown with LibreOffice
        continue-on-error: true
        env:
          LC_ALL: C.UTF-8
        run: |
          dart run tool/write_format_oracle.dart build/format_oracle
          soffice --headless \
            --convert-to 'csv:Text - txt - csv (StarCalc):44,34,UTF8,1,,0,false,true,true,false,false,1' \
            --outdir build/format_oracle build/format_oracle/*.xlsx
          ls -1 build/format_oracle

      - name: List LibreOffice's differences from the formatter
        continue-on-error: true
        run: dart run tool/compare_format_libreoffice.dart build/format_oracle
