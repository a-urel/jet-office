name: CI

# The `quality-gate` job runs the quality gate from AGENTS.md. A clean checkout
# must pass it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub's default shell, `bash -e {0}`, has no pipefail, so `cmd | tee log`
# reports tee's status. An explicit shell makes GitHub run
# `bash --noprofile --norc -eo pipefail {0}` for every step.
defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero infos)
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Run tests on Chrome
        run: dart test -p chrome

  # A second opinion on the number formatter, not Excel: LibreOffice's text
  # "as shown" for each oracle case. The tool lists differences and exits 0
  # with any; Excel's CSVs (test/fixtures/owner/number_format/) are the
  # oracle and run in the quality gate. These steps never fail the job.
  second-opinion:
    name: second opinion (LibreOffice)
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Resolve dependencies
        run: dart pub get

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Export the number format oracle as shown with LibreOffice
        continue-on-error: true
        env:
          LC_ALL: C.UTF-8
        run: |
          dart run tool/write_format_oracle.dart build/format_oracle
          soffice --headless \
            --convert-to 'csv:Text - txt - csv (StarCalc):44,34,UTF8,1,,0,false,true,true,false,false,1' \
            --outdir build/format_oracle build/format_oracle/*.xlsx
          ls -1 build/format_oracle

      - name: List LibreOffice's differences from the formatter
        continue-on-error: true
        run: dart run tool/compare_format_libreoffice.dart build/format_oracle
