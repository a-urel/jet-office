# Test runner settings.
#
# Chrome exposes exact `performance.memory` figures only when it starts with
# --enable-precise-memory-info. The benchmark (benchmark/) reads them; the
# suite itself does not care.
override_platforms:
  chrome:
    settings:
      arguments: --enable-precise-memory-info

tags:
  benchmark:
    # 100,000 rows, four runs per writer, plus the correctness guard.
    timeout: 10m
