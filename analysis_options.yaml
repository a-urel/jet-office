# Strict static analysis for jet_office.
#
# The quality gate runs `dart analyze --fatal-infos`, so every lint below fails
# CI, not only errors. A clean checkout reports nothing.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODOs stay informational; with --fatal-infos they would otherwise fail
    # the gate.
    todo: ignore

linter:
  rules:
    # Documentation. The public API is what lib/jet_office.dart exports, and
    # every member of it carries real dartdoc (AGENTS.md, "Port, don't copy").
    - public_member_api_docs
    - comment_references
    - type_annotate_public_apis
    - always_declare_return_types

    # Inside lib/ the library imports its own internals relatively, which keeps
    # the lib/src boundary obvious and the architecture guards simple.
    - prefer_relative_imports
    - directives_ordering

    # Correctness.
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # Style.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - use_super_parameters
